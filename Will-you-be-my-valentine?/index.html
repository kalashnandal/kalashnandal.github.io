<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <!-- Google Fonts for a cute look -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables & Reset */
        :root {
            --primary: #ff4d6d;
            --secondary: #ff8fa3;
            --bg: #fff0f3;
            --text: #590d22;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            /* Cute background pattern */
            background-image: radial-gradient(var(--secondary) 1px, transparent 1px);
            background-size: 20px 20px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevent scrolling when button moves */
            transition: transform 0.1s ease-in-out;
        }

        /* The Main Card */
        .card {
            background: white;
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.2);
            text-align: center;
            max-width: 90%;
            width: 400px;
            position: relative;
            z-index: 10;
        }

        .gif-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            overflow: hidden;
            border-radius: 15px;
        }

        .gif-container img {
            width: 100%;
            height: 250px; /* Fixed height to make user photos look good */
            object-fit: cover; /* Crops the photo nicely to fill the box */
            border-radius: 15px;
            pointer-events: none; /* User can't drag image */
            display: block;
        }

        h1 {
            color: var(--primary);
            font-weight: 900;
            font-size: 1.8rem;
            margin-bottom: 2rem;
            line-height: 1.2;
        }

        /* Button Container */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            position: relative;
            min-height: 60px; /* Space for buttons */
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Nunito', sans-serif;
        }

        /* Yes Button Styling */
        #yesBtn {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #d90429;
        }

        /* No Button Styling */
        #noBtn {
            background-color: #fff;
            color: var(--text);
            border: 2px solid var(--secondary);
        }

        /* Result View (Hidden initially) */
        #resultContainer {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        #resultContainer h2 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        #resultContainer p {
            font-size: 1.2rem;
            color: var(--text);
        }

        /* Screen Shake Animation Class */
        .shake-screen {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-10px, 0, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(20px, 0, 0) rotate(2deg); }
            30%, 50%, 70% { transform: translate3d(-30px, 0, 0) rotate(-3deg); }
            40%, 60% { transform: translate3d(30px, 0, 0) rotate(3deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Modal for Mobile Error */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 4px solid var(--primary);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .modal-btn {
            margin-top: 1.5rem;
            background: var(--primary);
            color: white;
            width: 100%;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Confetti Elements */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: var(--primary);
            animation: fall linear forwards;
            z-index: 5;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

    </style>
</head>
<body>

    <!-- Main Card -->
    <div class="card" id="mainCard">
        <div class="gif-container">
            <!-- 
                IMPORTANT: This tries to load 'img_0604.jpg'. 
                If it's not found (like in the preview), it falls back to the bear GIF.
            -->
            <img src="IMG_0604.jpeg" 
                 alt="My Valentine Request"
                 onerror="this.onerror=null; this.src='https://media.giphy.com/media/LpdlqTkgO2Lwwixwv7/giphy.gif';">
        </div>
        <h1>Will you be my Valentine? 🥺</h1>
        
        <div class="btn-group">
            <button id="yesBtn" onclick="acceptLove()">Yes! 💖</button>
            <button id="noBtn">No 💔</button>
        </div>
    </div>

    <!-- Result Card (Shown after Yes) -->
    <div class="card" id="resultContainer">
        <div class="gif-container">
            <!-- Reliable Giphy Link: Bears Hugging -->
            <img src="https://media.giphy.com/media/1HQHB98FnWOX6/giphy.gif" 
                 alt="Bear Kisses">
        </div>
        <h2>YAYYY! 🥰</h2>
        <p>I knew you wouldn't say no!</p>
        <p>See you on the 14th, my love! ❤️</p>
    </div>

    <!-- Error Modal (Mobile) -->
    <div class="modal-overlay" id="errorModal">
        <div class="modal">
            <div class="modal-icon">⚠️</div>
            <h3 style="color: var(--primary); margin-bottom: 10px;">SYSTEM ERROR</h3>
            <p>Fatal Exception: 0xL0V3</p>
            <p><strong>"NO" is not a valid option.</strong></p>
            <p style="font-size: 0.9rem; margin-top: 10px; color: #666;">Please try selecting "Yes" instead.</p>
            <button class="modal-btn" onclick="closeModal()">Okay, I'm sorry 🥺</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const mainCard = document.getElementById('mainCard');
        const resultContainer = document.getElementById('resultContainer');
        const errorModal = document.getElementById('errorModal');
        const body = document.body;

        // Detect if user is on a touch device
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        // --- DESKTOP LOGIC (Run Away) ---
        if (!isTouchDevice) {
            noBtn.addEventListener('mouseenter', () => {
                // Get window dimensions
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                
                // Get button dimensions
                const btnRect = noBtn.getBoundingClientRect();
                const btnWidth = btnRect.width;
                const btnHeight = btnRect.height;

                // Calculate random position
                // Ensure it stays within viewport with some padding
                const randomX = Math.random() * (windowWidth - btnWidth - 50);
                const randomY = Math.random() * (windowHeight - btnHeight - 50);

                // Apply new position using fixed positioning so it escapes the flow
                noBtn.style.position = 'fixed';
                noBtn.style.left = randomX + 'px';
                noBtn.style.top = randomY + 'px';
                
                // Add a little rotation for chaos
                const randomRot = (Math.random() * 20) - 10;
                noBtn.style.transform = `rotate(${randomRot}deg)`;
            });
        }

        // --- MOBILE LOGIC (Shake & Error) ---
        if (isTouchDevice) {
            noBtn.addEventListener('click', (e) => {
                e.preventDefault(); // Stop any default behavior
                
                // 1. Shake the screen
                body.classList.add('shake-screen');
                
                // 2. Vibrate phone if supported (200ms)
                if (navigator.vibrate) {
                    navigator.vibrate(500);
                }

                // 3. Show Error Modal
                setTimeout(() => {
                    errorModal.style.display = 'flex';
                }, 200);

                // Remove shake class after animation so it can be triggered again
                setTimeout(() => {
                    body.classList.remove('shake-screen');
                }, 500);
            });
        }

        // Close modal function
        function closeModal() {
            errorModal.style.display = 'none';
        }

        // --- SHARED LOGIC (Acceptance) ---
        function acceptLove() {
            // Hide main card, show result
            mainCard.style.display = 'none';
            resultContainer.style.display = 'flex';
            
            // Trigger Confetti
            createConfetti();
        }

        // Simple Confetti Generator
        function createConfetti() {
            const colors = ['#ff4d6d', '#ff8fa3', '#fff0f3', '#ffd700', '#ffffff'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Random properties
                const bg = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100 + 'vw';
                const animDuration = Math.random() * 3 + 2 + 's';
                const size = Math.random() * 10 + 5 + 'px';
                
                confetti.style.backgroundColor = bg;
                confetti.style.left = left;
                confetti.style.animationDuration = animDuration;
                confetti.style.width = size;
                confetti.style.height = size;
                confetti.style.top = '-10px';
                
                // Random shape (circle or square)
                if (Math.random() > 0.5) {
                    confetti.style.borderRadius = '50%';
                }

                document.body.appendChild(confetti);

                // Cleanup after animation
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }
    </script>
</body>
</html>
