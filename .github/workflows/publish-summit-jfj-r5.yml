name: Publish tested JFJ audit visibility R5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-summit-jfj-r5.yml'
      - '.github/summit-jfj-r5.transfer'
permissions:
  contents: write
concurrency:
  group: summit-preview-update
  cancel-in-progress: false
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the tested preview with input and output checksum validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json, subprocess, sys, tempfile
          transfer = Path('.github/summit-jfj-r5.transfer')
          packed = transfer.read_bytes()
          assert hashlib.sha256(packed).hexdigest() == 'e7f205b660a801a06a9168c51529bb3fbe3af6e0cd2020aa22bcad5f7d97d9d3', 'Transfer checksum mismatch'
          sources = json.loads(gzip.decompress(packed))
          assert set(sources) == {'patch_r5.py', 'audit_bridge_r5.js', 'jfj_audits_r5.js'}, 'Unexpected source files'
          target = Path('summit-affiliate-preview/index.html')
          original = target.read_bytes()
          assert hashlib.sha256(original).hexdigest() == 'a2d424a98e429759d1ab874e7e3a6979d60c1242127b16dce0f291fd4364719a', 'Preview changed; reconcile before retrying'
          with tempfile.TemporaryDirectory(prefix='summit-r5-') as tmp:
              work = Path(tmp)
              (work / 'r4').mkdir()
              (work / 'r4' / 'index.html').write_bytes(original)
              code = work / 'r5' / 'source'
              code.mkdir(parents=True)
              for name, content in sources.items():
                  (code / name).write_text(content, encoding='utf-8')
              subprocess.run([sys.executable, str(code / 'patch_r5.py')], check=True)
              output = (work / 'r5' / 'index.html').read_bytes()
          assert len(output) == 3238621, 'Output length mismatch'
          assert hashlib.sha256(output).hexdigest() == 'f929411cf35fa724bc504310e287106f9df01b65738ae1c87c8d299f5145bb21', 'Output checksum mismatch'
          target.write_bytes(output)
          transfer.unlink()
          Path('.github/workflows/publish-summit-jfj-r5.yml').unlink()
          print('Verified R5. Only the standalone Summit sample preview was updated.')
          PY
      - name: Commit only preview changes and remove temporary transfer files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- summit-affiliate-preview/index.html .github/summit-jfj-r5.transfer .github/workflows/publish-summit-jfj-r5.yml
          git commit -m 'Add company-scoped read-only JFJ audit tracking and report library R5'
          git push origin HEAD:main
