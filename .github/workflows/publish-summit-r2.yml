name: Publish approved Summit R2 preview
on:
  push:
    branches: [main]
    paths:
      - '.summit-r2-publish/**'
      - '.github/workflows/publish-summit-r2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: summit-r2-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare exact image encoder and secure download client
        run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0' curl_cffi
      - name: Reconstruct and checksum the approved R2 file
        run: python .summit-r2-publish/reconstruct.py
      - name: Publish only the corrected preview file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add summit-affiliate-preview/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish byte-verified corrected Summit Partner Portal R2'
            git push origin HEAD:main
          fi
