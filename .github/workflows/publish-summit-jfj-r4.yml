name: Publish tested JFJ read-only preview R4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-summit-jfj-r4.yml'
      - '.github/summit-jfj-r4.transfer'
permissions:
  contents: write
concurrency:
  group: summit-preview-update
  cancel-in-progress: false
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified tested patch to preview only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json
          transfer = Path('.github/summit-jfj-r4.transfer')
          encoded = base64.b64encode(transfer.read_bytes()).decode('ascii')
          # Correct four checked transport transcription offsets before decoding.
          for before, after in [('Z7tlIvIv61aJt','Z7tlIv61aJt'),('KkfxleII0yjg','KkfxleI0yjg'),('hjTSYvppGGlWB0','hjTSYvppGWB0'),('BIOobTT1h','BIOobT1h')]:
              assert encoded.count(before) == 1, 'Transport mismatch; no files changed'
              encoded = encoded.replace(before, after)
          packed = base64.b64decode(encoded, validate=True)
          blob_hash = hashlib.sha1(b'blob ' + str(len(packed)).encode() + b'\x00' + packed).hexdigest()
          assert blob_hash == 'd28547f8b84494d87615496d7c9c28fff605d64d', 'Transfer checksum mismatch'
          patch = json.loads(gzip.decompress(packed))
          target = Path('summit-affiliate-preview/index.html')
          original = target.read_bytes()
          assert hashlib.sha256(original).hexdigest() == patch['base_sha256'], 'Preview changed; reconcile before retrying'
          result = original.decode('utf-8')
          for before, after in patch['replacements']:
              assert result.count(before) == 1, 'Ambiguous patch; no files changed'
              result = result.replace(before, after)
          output = result.encode('utf-8')
          assert hashlib.sha256(output).hexdigest() == 'a2d424a98e429759d1ab874e7e3a6979d60c1242127b16dce0f291fd4364719a'
          assert len(output) == 3201280
          target.write_bytes(output)
          transfer.unlink()
          Path('.github/workflows/publish-summit-jfj-r4.yml').unlink()
          print('Verified JFJ R4; only the standalone sample preview was updated.')
          PY
      - name: Commit preview and remove temporary publishing files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- summit-affiliate-preview/index.html .github/summit-jfj-r4.transfer .github/workflows/publish-summit-jfj-r4.yml
          git commit -m 'Add company-scoped view-only JFJ leadership preview R4'
          git push origin HEAD:main
