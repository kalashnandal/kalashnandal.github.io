name: Publish tested Summit visual QA R3
on:
  push:
    branches: [main]
    paths:
      - '.github/summit-visual-r3.zlib'
      - '.github/workflows/publish-summit-visual-r3.yml'
permissions:
  contents: write
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact tested patch with before and after checksums
        shell: python
        run: |
          from pathlib import Path
          import json, zlib, hashlib
          p = json.loads(zlib.decompress(Path('.github/summit-visual-r3.zlib').read_bytes()))
          target = Path('summit-affiliate-preview/index.html')
          s = target.read_text(encoding='utf-8')
          assert hashlib.sha256(s.encode()).hexdigest() == p['base_sha256'], 'Preview changed; refusing overwrite'
          key = 'const PORTAL_AUDIT_DOCUMENT='
          start = s.index(key) + len(key)
          audit, n = json.JSONDecoder().raw_decode(s[start:])
          key2 = 'const REPORT_READER_CSS='
          a = audit.index(key2) + len(key2)
          _, nn = json.JSONDecoder().raw_decode(audit[a:])
          audit = audit[:a] + json.dumps(p['report_css']) + audit[a+nn:]
          audit = audit.replace('</head>', '<style id="summit-audit-qa-r3">' + p['audit_css'] + '</style></head>', 1)
          s = s[:start] + json.dumps(audit, ensure_ascii=True).replace('<', '\\u003c') + s[start+n:]
          s = s.replace('</head>', '<style id="summit-visual-qa-r3">' + p['parent_css'] + '</style></head>', 1)
          needle = 'refreshDemo();startWorkspaceQuotes();'
          assert s.count(needle) == 1
          s = s.replace(needle, p['parent_js'] + '\n' + needle)
          s = s.replace('No live changes · Build r2', 'No live changes · Build r3')
          output = s.encode('utf-8')
          assert hashlib.sha256(output).hexdigest() == p['new_sha256'], 'Output differs from tested R3'
          assert len(output) == p['bytes']
          target.write_bytes(output)
          print('Verified R3:', len(output), hashlib.sha256(output).hexdigest())
      - name: Commit preview only and remove temporary publishing files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add summit-affiliate-preview/index.html
          git rm .github/summit-visual-r3.zlib .github/workflows/publish-summit-visual-r3.yml
          git commit -m 'Apply tested mobile and desktop visual QA fixes to Summit preview R3'
          git push origin HEAD:main
