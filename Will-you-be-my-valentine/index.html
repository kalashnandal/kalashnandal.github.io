<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d6d;
            --secondary: #ff8fa3;
            --bg: #fff0f3;
            --text: #590d22;
            --input-bg: rgba(255, 255, 255, 0.8);
            --error: #d90429;
            --success: #2a9d8f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(var(--secondary) 1px, transparent 1px);
            background-size: 20px 20px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            transition: transform 0.1s ease-in-out;
        }
        .card {
            background-image: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), url('https://kalashnandal.co.in/IMG_0604.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.3);
            text-align: center;
            max-width: 90%;
            width: 450px;
            position: relative;
            z-index: 10;
            transition: all 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid white;
        }
        .card::-webkit-scrollbar { width: 8px; }
        .card::-webkit-scrollbar-track { background: rgba(255,255,255,0.5); border-radius: 10px; }
        .card::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 10px; }
        .gif-container {
            display: flex; justify-content: center; align-items: center; margin-bottom: 1.5rem;
            overflow: hidden; border-radius: 15px; min-height: 200px; background: white;
        }
        .gif-container img { width: 100%; height: 250px; object-fit: cover; border-radius: 15px; pointer-events: none; display: block; }
        h1 { color: var(--primary); font-weight: 900; font-size: 1.8rem; margin-bottom: 2rem; line-height: 1.2; text-shadow: 1px 1px 0px white; }
        .btn-group { display: flex; justify-content: center; gap: 1rem; position: relative; min-height: 60px; }
        button {
            padding: 12px 30px; font-size: 1.2rem; font-weight: 700; border: none; border-radius: 50px;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; font-family: 'Nunito', sans-serif;
        }
        #yesBtn, .submit-btn { background-color: var(--primary); color: white; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4); }
        #yesBtn:hover, .submit-btn:hover { transform: scale(1.1); background-color: #d90429; }
        #noBtn { background-color: #fff; color: var(--text); border: 2px solid var(--secondary); }
        #quizContainer, #resultContainer { display: none; text-align: left; }
        #resultContainer { text-align: center; flex-direction: column; align-items: center; animation: fadeIn 0.5s ease; }
        #quizContainer h2, #resultContainer h2 { text-align: center; color: var(--primary); margin-bottom: 1.5rem; text-shadow: 1px 1px 0px white; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; color: var(--text); font-weight: 800; font-size: 1rem; }
        .form-input {
            width: 100%; padding: 12px; border: 2px solid var(--secondary); border-radius: 15px;
            background-color: var(--input-bg); font-family: 'Nunito', sans-serif; font-size: 1rem; color: var(--text);
            outline: none; transition: border-color 0.3s, background-color 0.3s;
        }
        input[type="file"] { background: white; padding: 10px; font-size: 0.9rem; }
        input[type="file"]::file-selector-button {
            border: none; background: var(--secondary); padding: 8px 16px; border-radius: 10px;
            color: white; cursor: pointer; font-weight: bold; margin-right: 10px; transition: background .2s;
        }
        textarea.form-input { resize: vertical; min-height: 150px; line-height: 1.5; }
        .submit-btn { width: 100%; margin-top: 1rem; opacity: 0.6; cursor: not-allowed; transition: all 0.3s ease; }
        .submit-btn.active { opacity: 1; cursor: pointer; }
        .word-count {
            text-align: right; font-size: 0.85rem; margin-top: 5px; font-weight: bold; color: var(--error);
            transition: color 0.3s; background: rgba(255,255,255,0.7); display: inline-block; padding: 2px 5px; border-radius: 5px; float: right;
        }
        .word-count.success { color: var(--success); }
        .shake-screen { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-10px, 0, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(20px, 0, 0) rotate(2deg); }
            30%, 50%, 70% { transform: translate3d(-30px, 0, 0) rotate(-3deg); }
            40%, 60% { transform: translate3d(30px, 0, 0) rotate(3deg); }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px);
        }
        .modal {
            background: white; padding: 2rem; border-radius: 20px; text-align: center; max-width: 80%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 4px solid var(--primary); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-btn { margin-top: 1.5rem; background: var(--primary); color: white; width: 100%; }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .confetti { position: fixed; width: 10px; height: 10px; background-color: var(--primary); animation: fall linear forwards; z-index: 5; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <div class="gif-container">
            <img src="https://kalashnandal.co.in/Remember-the-penguine%3F/Our.jpeg" 
                 alt="My Valentine Request"
                 onerror="this.onerror=null; this.src='https://media.giphy.com/media/LpdlqTkgO2Lwwixwv7/giphy.gif';">
        </div>
        <h1>Will you be my Valentine? 🥺</h1>
        <div class="btn-group">
            <button id="yesBtn" onclick="goToQuiz()">Yes! 💖</button>
            <button id="noBtn">No 💔</button>
        </div>
    </div>

    <div class="card" id="quizContainer">
        <h2>Wait! A few small requests... 🧐</h2>
        
        <!-- FORM SUBMIT WITH SECURE ID -->
        <form id="valentineForm" action="https://formsubmit.co/73b3cd5c9cde4c06b4ff5442be3c931d" method="POST" enctype="multipart/form-data">
            
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_subject" value="New Valentine Submission! 💖">
            
            <!-- Redirect back to this page with a success flag -->
            <input type="hidden" name="_next" id="nextUrl" value="">

            <div class="form-group">
                <label class="form-label">1. When did we first meet?</label>
                <input type="text" name="1_Met" class="form-input" placeholder="e.g. The day the world got brighter" required>
            </div>
            <div class="form-group">
                <label class="form-label">2. What is my favorite food?</label>
                <input type="text" name="2_Food" class="form-input" placeholder="Don't get this wrong..." required>
            </div>
            <div class="form-group">
                <label class="form-label">3. Love Scale (10-10)</label>
                <input type="number" name="3_Scale" class="form-input" min="10" placeholder="Hint: Start at 10..." required>
            </div>
            <div class="form-group">
                <label class="form-label">4. Selfie Check-in 📸</label>
                <input type="file" name="attachment" class="form-input" accept="image/*" required>
            </div>
            <div class="form-group">
                <label class="form-label">5. Audio/Video Check-in 🎤</label>
                <p style="font-size: 0.8rem; color: #444; margin-bottom: 8px;">(Record "I love you")</p>
                <input type="file" name="attachment2" class="form-input" accept="audio/*,video/*" required>
            </div>
            <div class="form-group">
                <label class="form-label">6. Our Love Essay ✍️</label>
                <p style="font-size: 0.8rem; color: #444; margin-bottom: 8px; font-weight: 600;">(Minimum 250 words)</p>
                <textarea id="loveEssay" name="6_Essay" class="form-input" rows="10" placeholder="Start typing here..." oninput="checkWordCount()"></textarea>
                <div id="wordCounter" class="word-count">0 / 250 words</div>
                <div style="clear: both;"></div>
            </div>
            <button type="submit" id="submitBtn" class="submit-btn" disabled>Submit Answers 💌</button>
        </form>
    </div>

    <div class="card" id="resultContainer">
        <div class="gif-container">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3h6cW51Z2Q5M3Z6cW51Z2Q5M3Z6cW51Z2Q5MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26BRv0ThflsHCqDrG/giphy.gif" 
                 alt="Bear Kisses"
                 onerror="this.src='https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif'">
        </div>
        <h2>YAYYY! 🥰</h2>
        <p>I knew you wouldn't say no!</p>
        <p>See you on the 14th, my love! ❤️</p>
    </div>

    <div class="modal-overlay" id="errorModal">
        <div class="modal">
            <div class="modal-icon">⚠️</div>
            <h3 style="color: var(--primary); margin-bottom: 10px;">SYSTEM ERROR</h3>
            <p>Fatal Exception: 0xL0V3</p>
            <p><strong>"NO" is not a valid option.</strong></p>
            <p style="font-size: 0.9rem; margin-top: 10px; color: #666;">Try selecting "Yes".</p>
            <button class="modal-btn" onclick="document.getElementById('errorModal').style.display='none'">Okay, I'm sorry 🥺</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const mainCard = document.getElementById('mainCard');
        const quizContainer = document.getElementById('quizContainer');
        const resultContainer = document.getElementById('resultContainer');
        const submitBtn = document.getElementById('submitBtn');
        const body = document.body;
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        // 1. SETUP REDIRECT URL
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('submitted')) {
                mainCard.style.display = 'none';
                quizContainer.style.display = 'none';
                resultContainer.style.display = 'flex';
                createConfetti();
            }
            const currentUrl = window.location.href.split('?')[0];
            document.getElementById('nextUrl').value = currentUrl + "?submitted=true";
        };

        // 2. FORM VALIDATION
        document.getElementById('valentineForm').addEventListener('submit', function(e) {
            const text = document.getElementById('loveEssay').value;
            const words = text.trim().split(/\s+/).filter(word => word.length > 0);
            
            if (words.length < 250) { 
                e.preventDefault(); 
                alert("Please reach 250 words!"); 
                return;
            }
            submitBtn.disabled = true;
            submitBtn.innerHTML = "Uploading Files... Please Wait! ⏳";
        });

        // Word Count Logic
        function checkWordCount() {
            const text = document.getElementById('loveEssay').value;
            const words = text.trim().split(/\s+/).filter(word => word.length > 0);
            const count = words.length;
            const LIMIT = 250;
            const counterEl = document.getElementById('wordCounter');
            counterEl.textContent = `${count} / ${LIMIT} words`;

            if (count >= LIMIT) {
                counterEl.classList.add('success');
                submitBtn.disabled = false;
                submitBtn.classList.add('active');
                submitBtn.innerHTML = "Submit Answers 💌";
            } else {
                counterEl.classList.remove('success');
                submitBtn.disabled = true;
                submitBtn.classList.remove('active');
                submitBtn.innerHTML = `Write ${LIMIT - count} more words...`;
            }
        }

        // "No" Button Logic
        if (!isTouchDevice) {
            noBtn.addEventListener('mouseenter', () => {
                const btnRect = noBtn.getBoundingClientRect();
                const randomX = Math.random() * (window.innerWidth - btnRect.width - 50);
                const randomY = Math.random() * (window.innerHeight - btnRect.height - 50);
                noBtn.style.position = 'fixed';
                noBtn.style.left = randomX + 'px';
                noBtn.style.top = randomY + 'px';
            });
        } else {
            noBtn.addEventListener('click', (e) => {
                e.preventDefault();
                body.classList.add('shake-screen');
                if (navigator.vibrate) navigator.vibrate(500);
                setTimeout(() => document.getElementById('errorModal').style.display = 'flex', 200);
                setTimeout(() => body.classList.remove('shake-screen'), 500);
            });
        }

        function goToQuiz() {
            mainCard.style.display = 'none';
            quizContainer.style.display = 'block';
        }

        function createConfetti() {
            const colors = ['#ff4d6d', '#ff8fa3', '#fff0f3', '#ffd700', '#ffffff'];
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                const bg = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.backgroundColor = bg;
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.top = '-10px';
                if (Math.random() > 0.5) confetti.style.borderRadius = '50%';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }
    </script>
</body>
</html>
