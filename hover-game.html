<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Hover - Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050510;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }
        .pointer-events-auto { pointer-events: auto; }
        .neon-text-cyan { color: #fff; text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #0ff, 0 0 40px #0ff; }
        .neon-text-pink { color: #fff; text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #f0f, 0 0 40px #f0f; }
        .neon-text-orange { color: #fff; text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #f90, 0 0 40px #f90; }
        
        .neon-btn {
            background: rgba(0, 20, 20, 0.6); color: #fff; border: 2px solid #0ff;
            box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff; transition: all 0.2s ease-in-out;
            text-shadow: 0 0 5px #fff, 0 0 10px #0ff; backdrop-filter: blur(4px);
        }
        .neon-btn:hover:not(:disabled), .neon-btn:active:not(:disabled) {
            background: rgba(0, 255, 255, 0.2); box-shadow: 0 0 20px #0ff, inset 0 0 20px #0ff; transform: scale(1.05);
        }
        .neon-btn:disabled { border-color: #555; box-shadow: none; color: #777; cursor: not-allowed; }
        
        .neon-btn-pink { border-color: #f0f; box-shadow: 0 0 10px #f0f, inset 0 0 10px #f0f; text-shadow: 0 0 5px #fff, 0 0 10px #f0f; }
        .neon-btn-pink:hover:not(:disabled) { background: rgba(255, 0, 255, 0.2); box-shadow: 0 0 20px #f0f, inset 0 0 20px #f0f; }
        
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px; pointer-events: none; z-index: 20; opacity: 0.6;
        }
        .vignette {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            box-shadow: 0 0 150px rgba(0,0,0,0.9) inset; pointer-events: none; z-index: 15;
        }
        .hidden { display: none !important; }
        @keyframes shake {
            0%, 100% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
        }
        .shake-screen { animation: shake 0.4s 1; }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <!-- Main Menu -->
        <div id="menu-screen" class="flex flex-col items-center pointer-events-auto bg-black/60 p-8 rounded-3xl backdrop-blur-md border border-cyan-500/30">
            <h1 class="text-5xl md:text-7xl font-black mb-2 neon-text-cyan tracking-wider text-center">NEON</h1>
            <h1 class="text-5xl md:text-7xl font-black mb-8 neon-text-pink tracking-wider text-center">HOVER</h1>
            <p class="text-gray-400 mb-8 text-sm md:text-base tracking-widest uppercase">Tap, Click or Space to Fly</p>
            
            <div class="flex flex-col gap-4 w-full">
                <button id="btn-solo" class="neon-btn px-8 py-3 rounded-full text-xl font-bold uppercase tracking-widest cursor-pointer w-full">
                    Play Solo
                </button>
                <button id="btn-host" class="neon-btn neon-btn-pink px-8 py-3 rounded-full text-xl font-bold uppercase tracking-widest cursor-pointer w-full">
                    Host Multiplayer
                </button>
            </div>
        </div>

        <!-- Multiplayer Lobby -->
        <div id="lobby-screen" class="hidden flex flex-col items-center pointer-events-auto bg-black/80 p-8 rounded-3xl backdrop-blur-md border border-pink-500/50">
            <h2 class="text-3xl font-black mb-6 neon-text-pink tracking-wider">LOBBY</h2>
            
            <div id="lobby-host-ui" class="flex flex-col items-center w-full">
                <p class="text-gray-300 mb-2 uppercase tracking-widest text-sm">Send this link to a friend:</p>
                <div class="flex items-center gap-2 mb-6 w-full">
                    <input type="text" id="invite-link" readonly class="bg-gray-900 text-cyan-400 px-4 py-2 rounded-lg border border-cyan-500/50 w-full outline-none text-sm font-mono">
                    <button id="btn-copy" class="neon-btn px-4 py-2 rounded-lg text-sm font-bold cursor-pointer whitespace-nowrap">Copy</button>
                </div>
                <div id="lobby-status" class="text-yellow-400 mb-6 animate-pulse tracking-widest uppercase">Waiting for player...</div>
                <button id="btn-start-multi" disabled class="neon-btn neon-btn-pink px-8 py-3 rounded-full text-xl font-bold uppercase tracking-widest w-full">
                    Start Game
                </button>
            </div>
            
            <div id="lobby-guest-ui" class="hidden flex flex-col items-center w-full">
                <p class="text-cyan-400 mb-6 uppercase tracking-widest animate-pulse">Waiting for Host to start...</p>
            </div>
            
            <button id="btn-leave" class="mt-6 text-gray-500 hover:text-white uppercase tracking-widest text-sm transition-colors">Cancel / Leave</button>
        </div>

        <!-- In-Game HUD -->
        <div id="hud-screen" class="hidden absolute top-4 md:top-8 w-full flex justify-between px-8 md:px-16 pointer-events-none">
            <div class="flex flex-col">
                <div class="text-white text-2xl md:text-4xl font-bold" style="text-shadow: 0 0 10px #fff;">
                    <span id="score-display">0</span>
                </div>
                <div id="hud-p1-label" class="text-cyan-400 text-xs tracking-widest uppercase hidden">YOU</div>
            </div>
            <div class="flex flex-col items-end">
                <div id="hud-highscore-container" class="text-gray-400 text-sm md:text-base tracking-widest uppercase">
                    Best: <span id="highscore-display">0</span>
                </div>
                <div id="hud-p2-container" class="hidden flex flex-col items-end">
                    <div class="text-white text-2xl md:text-4xl font-bold neon-text-orange">
                        <span id="p2-score-display">0</span>
                    </div>
                    <div class="text-orange-400 text-xs tracking-widest uppercase">OPPONENT</div>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="hidden flex flex-col items-center pointer-events-auto bg-black/80 w-full h-full justify-center backdrop-blur-sm">
            <h2 id="go-title" class="text-4xl md:text-6xl font-black mb-4 text-red-500 tracking-wider" style="text-shadow: 0 0 20px red;">SYSTEM FAILURE</h2>
            <p id="go-subtitle" class="text-xl mb-6 text-cyan-400 tracking-widest uppercase hidden"></p>
            
            <div class="flex flex-col items-center bg-gray-900/50 p-6 md:p-8 rounded-2xl border border-pink-500/30 mb-8" style="box-shadow: 0 0 30px rgba(255,0,255,0.2) inset;">
                <p class="text-gray-300 text-lg uppercase tracking-widest mb-1">Score</p>
                <p id="final-score" class="text-5xl font-bold text-white mb-4 neon-text-cyan">0</p>
                <div id="go-multi-stats" class="hidden flex flex-col items-center border-t border-gray-700 pt-4 w-full">
                     <p class="text-gray-400 text-sm uppercase tracking-widest mb-1">Opponent</p>
                     <p id="final-p2-score" class="text-3xl font-bold text-orange-400">0</p>
                </div>
                <div id="go-solo-stats" class="flex flex-col items-center w-full">
                    <p class="text-gray-400 text-sm uppercase tracking-widest mb-1">High Score</p>
                    <p id="final-highscore" class="text-2xl font-bold text-pink-400">0</p>
                </div>
            </div>
            
            <button id="btn-restart" class="neon-btn px-8 py-3 rounded-full text-xl font-bold uppercase tracking-widest cursor-pointer mb-4">
                Reboot
            </button>
            <button id="btn-menu" class="text-gray-500 hover:text-white uppercase tracking-widest text-sm transition-colors">
                Main Menu
            </button>
        </div>
        
        <!-- Toast Notification -->
        <div id="toast" class="hidden absolute bottom-10 bg-cyan-900/80 border border-cyan-400 text-white px-6 py-3 rounded-full backdrop-blur-sm transition-opacity duration-300">
            Copied to clipboard!
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Variables
        let app, db, auth;
        let userId = null;
        let isMultiplayer = false;
        let isHost = false;
        let currentRoomId = null;
        let unsubscribeRoom = null;
        let syncInterval = null;
        
        // Environment handling
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'neon-hover-local';
        
        // ⚠️ PASTE YOUR FIREBASE CONFIG HERE FOR GITHUB PAGES ⚠️
        let firebaseConfig = {
            apiKey: "AIzaSyCbaDDMDmZd3YkgvToahSf-cQcu1M6nxdM",
            authDomain: "hover-game-efe44.firebaseapp.com",
            projectId: "hover-game-efe44",
            storageBucket: "hover-game-efe44.firebasestorage.app",
            messagingSenderId: "506500861618",
            appId: "1:506500861618:web:9290201367e97b79a643ab",
            measurementId: "G-GLNYST2RTF"
        };
        
        try {
            // This line ensures it still works if you preview it in this chat!
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            }
        } catch(e) { console.warn("No firebase config found."); }

        // Initialize Firebase if available
        if (firebaseConfig) {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            
            const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            if(token) {
                signInWithCustomToken(auth, token).catch(e => signInAnonymously(auth));
            } else {
                signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    userId = user.uid;
                    checkUrlForRoom();
                }
            });
        }

        // DOM Elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const screens = {
            menu: document.getElementById('menu-screen'),
            lobby: document.getElementById('lobby-screen'),
            hud: document.getElementById('hud-screen'),
            gameover: document.getElementById('gameover-screen')
        };
        
        // UI Updates
        const scoreDisplay = document.getElementById('score-display');
        const highscoreDisplay = document.getElementById('highscore-display');
        const p2ScoreDisplay = document.getElementById('p2-score-display');
        const finalScore = document.getElementById('final-score');
        const finalHighscore = document.getElementById('final-highscore');
        const finalP2Score = document.getElementById('final-p2-score');
        const goTitle = document.getElementById('go-title');
        const goSubtitle = document.getElementById('go-subtitle');

        // Game State variables
        let gameState = 'MENU'; // MENU, LOBBY, PLAYING, GAMEOVER
        let score = 0;
        let highScore = localStorage.getItem('neonHoverHighScore') || 0;
        highscoreDisplay.innerText = highScore;

        // Engine variables
        let cw = window.innerWidth;
        let ch = window.innerHeight;
        let scale;
        let frameCount = 0;
        let gameSpeed = 1;
        let difficultyMultiplier = 1;
        let currentSeed = Math.random();
        let nextSpawnFrame = 0;

        // Seeded RNG for synchronized multiplayer obstacles
        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }
        let prng = Math.random; // Default to standard Math.random

        // Entities
        let obstacles = [];
        let particles = [];
        let stars = [];

        class Player {
            constructor(isOpponent = false) {
                this.isOpponent = isOpponent;
                this.reset();
            }

            reset() {
                this.size = Math.max(15, Math.min(25, ch * 0.025));
                this.x = cw * 0.2;
                this.y = ch * 0.5;
                this.targetY = this.y; // For multiplayer interpolation
                this.vy = 0;
                
                this.gravity = ch * 0.0004;
                this.jumpStrength = ch * -0.008;
                
                this.rotation = 0;
                this.color = this.isOpponent ? '#f90' : '#0ff';
                this.glow = this.isOpponent ? '#f90' : '#0ff';
                this.isDead = false;
                this.score = 0;
            }

            jump() {
                if(gameState !== 'PLAYING' || this.isOpponent || this.isDead) return;
                this.vy = this.jumpStrength;
                this.spawnParticles();
            }

            spawnParticles() {
                for(let i=0; i<5; i++) {
                    particles.push(new Particle(
                        this.x - this.size, this.y, 
                        (Math.random() - 0.5) * 5 - 2, 
                        (Math.random() - 0.5) * 2 + 1,
                        this.color
                    ));
                }
            }

            update() {
                if(this.isDead) return;

                if (this.isOpponent) {
                    // Smoothly interpolate to networked Y position
                    this.y += (this.targetY - this.y) * 0.2;
                    // Approximate rotation based on vertical movement
                    this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, ((this.targetY - this.y) * 0.05)));
                } else {
                    this.vy += this.gravity;
                    this.y += this.vy;

                    // Bounds
                    if (this.y - this.size < 0) {
                        this.y = this.size; this.vy = 0;
                    }
                    if (this.y + this.size > ch) {
                        handleDeath();
                    }
                    this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.vy * 0.1)));
                }
            }

            draw() {
                if(this.isDead) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.globalAlpha = this.isOpponent ? 0.5 : 1.0;
                ctx.shadowBlur = this.isOpponent ? 10 : 20;
                ctx.shadowColor = this.glow;
                ctx.fillStyle = '#fff';
                
                // Draw spaceship
                ctx.beginPath();
                ctx.moveTo(this.size, 0);
                ctx.lineTo(-this.size, -this.size * 0.8);
                ctx.lineTo(-this.size + 5, 0);
                ctx.lineTo(-this.size, this.size * 0.8);
                ctx.closePath();
                ctx.fill();

                // Thrust glow
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.isOpponent ? '#ff0' : '#f0f';
                ctx.fillStyle = this.isOpponent ? '#ff0' : '#f0f';
                ctx.beginPath();
                ctx.arc(-this.size, 0, this.size * 0.3 + (Math.random() * 2), 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Obstacle {
            constructor() {
                this.width = Math.max(40, Math.min(80, cw * 0.05));
                this.x = cw + this.width;
                
                // Base gap on percentage of screen height for cross-device sync
                let gapBaseRatio = 0.35;
                let gapMinRatio = 0.15;
                
                // Difficulty increases as time goes on, completely synced for both players
                let timeDiff = (frameCount / 3000); 
                this.gapRatio = Math.max(gapMinRatio, gapBaseRatio - timeDiff);
                
                // Center of the gap (between 25% and 75% of screen height)
                let gapCenterRatio = prng() * 0.5 + 0.25;
                
                this.topRatio = gapCenterRatio - (this.gapRatio / 2);
                this.bottomRatio = gapCenterRatio + (this.gapRatio / 2);
                
                this.passed = false;
                this.color = '#f0f';
            }
            update() { this.x -= (cw * 0.006) * gameSpeed * difficultyMultiplier; }
            draw() {
                ctx.save();
                ctx.shadowBlur = 15; ctx.shadowColor = this.color;
                ctx.fillStyle = '#111'; ctx.strokeStyle = this.color; ctx.lineWidth = 2;

                let topH = this.topRatio * ch;
                let bottomY = this.bottomRatio * ch;

                ctx.beginPath(); ctx.rect(this.x, 0, this.width, topH);
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.rect(this.x, bottomY, this.width, ch - bottomY);
                ctx.fill(); ctx.stroke();

                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - 5, topH - 10, this.width + 10, 10);
                ctx.fillRect(this.x - 5, bottomY, this.width + 10, 10);
                ctx.restore();
            }
            checkCollision(p) {
                if(p.isDead) return false;
                let topH = this.topRatio * ch;
                let bottomY = this.bottomRatio * ch;
                
                let pL = p.x - p.size + 5, pR = p.x + p.size - 5;
                let pT = p.y - p.size + 5, pB = p.y + p.size - 5;
                let oL = this.x, oR = this.x + this.width;
                
                if (pR > oL && pL < oR) {
                    if (pT < topH || pB > bottomY) return true;
                }
                return false;
            }
        }

        class Particle {
            constructor(x, y, vx, vy, color) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.color = color;
                this.life = 1; this.decay = Math.random() * 0.02 + 0.02; this.size = Math.random() * 3 + 2;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
            draw() {
                ctx.save(); ctx.globalAlpha = this.life; ctx.shadowBlur = 10;
                ctx.shadowColor = this.color; ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size); ctx.restore();
            }
        }

        class Star {
            constructor() { this.reset(true); }
            reset(randomX = false) {
                this.x = randomX ? Math.random() * cw : cw; this.y = Math.random() * ch;
                this.size = Math.random() * 2 + 1; this.speed = (Math.random() * 0.5 + 0.1) * cw * 0.001;
                this.alpha = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x -= this.speed * gameSpeed * difficultyMultiplier;
                if (this.x < 0) this.reset();
            }
            draw() {
                ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = '#fff';
                ctx.fillRect(this.x, this.y, this.size, this.size); ctx.restore();
            }
        }

        const player = new Player();
        const opponent = new Player(true);

        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            if(screens[screenName]) screens[screenName].classList.remove('hidden');
        }

        function checkUrlForRoom() {
            const urlParams = new URLSearchParams(window.location.search);
            const room = urlParams.get('room');
            if (room && firebaseConfig && userId) {
                joinRoom(room);
            }
        }

        async function createRoom() {
            if (!userId) return;
            currentRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            isHost = true;
            isMultiplayer = true;
            
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
            await setDoc(roomRef, {
                host: userId,
                guest: null,
                status: 'waiting',
                seed: Math.floor(Math.random() * 1000000),
                p1: { y: 0, score: 0, dead: false },
                p2: { y: 0, score: 0, dead: false }
            });

            // Update URL for sharing
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + currentRoomId;
            window.history.pushState({path:newUrl},'',newUrl);
            
            document.getElementById('invite-link').value = newUrl;
            document.getElementById('lobby-host-ui').classList.remove('hidden');
            document.getElementById('lobby-guest-ui').classList.add('hidden');
            switchScreen('lobby');
            
            listenToRoom();
        }

        async function joinRoom(roomId) {
            if (!userId) return;
            currentRoomId = roomId;
            isHost = false;
            isMultiplayer = true;
            
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
            const docSnap = await getDoc(roomRef);
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                if(data.host !== userId) {
                    await updateDoc(roomRef, { guest: userId });
                } else {
                    isHost = true; // Rejoining own room
                }
                
                gameState = 'LOBBY';
                document.getElementById('lobby-host-ui').classList.add('hidden');
                document.getElementById('lobby-guest-ui').classList.remove('hidden');
                switchScreen('lobby');
                listenToRoom();
            } else {
                alert("Room not found or expired.");
                leaveRoom();
            }
        }

        function listenToRoom() {
            if(!currentRoomId || !userId) return;
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
            
            unsubscribeRoom = onSnapshot(roomRef, (docSnap) => {
                if(!docSnap.exists()) {
                    leaveRoom();
                    return;
                }
                
                const data = docSnap.data();
                
                // Lobby updates
                if (gameState === 'LOBBY') {
                    if (isHost && data.guest) {
                        document.getElementById('lobby-status').innerText = "Opponent Joined!";
                        document.getElementById('lobby-status').classList.remove('text-yellow-400', 'animate-pulse');
                        document.getElementById('lobby-status').classList.add('text-green-400');
                        document.getElementById('btn-start-multi').disabled = false;
                    }
                    if (!isHost && data.status === 'playing') {
                        currentSeed = data.seed;
                        startMatch();
                    }
                }
                
                // In-game updates
                if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                    const myData = isHost ? data.p1 : data.p2;
                    const oppData = isHost ? data.p2 : data.p1;
                    
                    if (oppData) {
                        opponent.targetY = oppData.y;
                        opponent.score = oppData.score;
                        opponent.isDead = oppData.dead;
                        p2ScoreDisplay.innerText = opponent.score;
                    }
                    
                    if(data.status === 'gameover' && gameState !== 'GAMEOVER') {
                       triggerGameOverScreen();
                    }
                    
                    // Host restarting game
                    if(!isHost && data.status === 'playing' && gameState === 'GAMEOVER') {
                        currentSeed = data.seed;
                        startMatch();
                    }
                }
            }, (error) => console.error("Firebase sync error:", error));
        }

        async function updateNetworkState() {
            if(!isMultiplayer || !currentRoomId || !userId || (gameState !== 'PLAYING' && gameState !== 'GAMEOVER')) return;
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
            const updateData = isHost ? 
                { 'p1.y': player.y, 'p1.score': score, 'p1.dead': player.isDead } : 
                { 'p2.y': player.y, 'p2.score': score, 'p2.dead': player.isDead };
            
            try { await updateDoc(roomRef, updateData); } catch(e){}
        }

        async function hostStartGame() {
            if(!isHost || !currentRoomId) return;
            currentSeed = Math.floor(Math.random() * 1000000);
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
            await updateDoc(roomRef, { 
                status: 'playing', 
                seed: currentSeed,
                'p1.score': 0, 'p1.dead': false,
                'p2.score': 0, 'p2.dead': false
            });
            startMatch();
        }

        function leaveRoom() {
            if(unsubscribeRoom) unsubscribeRoom();
            if(syncInterval) clearInterval(syncInterval);
            isMultiplayer = false;
            currentRoomId = null;
            window.history.pushState({}, '', window.location.pathname);
            switchScreen('menu');
            gameState = 'MENU';
        }

        function startMatch() {
            prng = isMultiplayer ? mulberry32(currentSeed) : Math.random;
            player.reset();
            if(isMultiplayer) opponent.reset();
            
            obstacles = [];
            particles = [];
            score = 0;
            frameCount = 0;
            nextSpawnFrame = 60; // Spawn first obstacle gracefully
            difficultyMultiplier = 1;
            scoreDisplay.innerText = score;
            if(isMultiplayer) p2ScoreDisplay.innerText = 0;
            
            gameState = 'PLAYING';
            
            // Adjust HUD for mode
            if(isMultiplayer) {
                document.getElementById('hud-p1-label').classList.remove('hidden');
                document.getElementById('hud-p2-container').classList.remove('hidden');
                document.getElementById('hud-highscore-container').classList.add('hidden');
            } else {
                document.getElementById('hud-p1-label').classList.add('hidden');
                document.getElementById('hud-p2-container').classList.add('hidden');
                document.getElementById('hud-highscore-container').classList.remove('hidden');
            }
            
            switchScreen('hud');
            
            if(syncInterval) clearInterval(syncInterval);
            if(isMultiplayer) {
                syncInterval = setInterval(updateNetworkState, 150); // Sync state ~6 times a sec
            }
        }

        function createExplosion(target) {
            for(let i=0; i<30; i++) {
                particles.push(new Particle(
                    target.x, target.y, 
                    (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15, '#fff'
                ));
                particles.push(new Particle(
                    target.x, target.y, 
                    (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, target.color
                ));
            }
        }

        async function handleDeath() {
            if(player.isDead) return;
            player.isDead = true;
            createExplosion(player);
            document.body.classList.add('shake-screen');
            setTimeout(() => document.body.classList.remove('shake-screen'), 400);

            if(isMultiplayer) {
                await updateNetworkState();
                // If both dead, trigger game over
                if(opponent.isDead) {
                    if(isHost) {
                        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
                        await updateDoc(roomRef, { status: 'gameover' });
                    }
                    triggerGameOverScreen();
                }
            } else {
                triggerGameOverScreen();
            }
        }

        function triggerGameOverScreen() {
            gameState = 'GAMEOVER';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neonHoverHighScore', highScore);
            }
            
            setTimeout(() => {
                switchScreen('gameover');
                finalScore.innerText = score;
                
                if (isMultiplayer) {
                    document.getElementById('go-multi-stats').classList.remove('hidden');
                    document.getElementById('go-solo-stats').classList.add('hidden');
                    finalP2Score.innerText = opponent.score;
                    
                    goSubtitle.classList.remove('hidden');
                    if(score > opponent.score) {
                        goSubtitle.innerText = "YOU WON";
                        goSubtitle.className = "text-xl mb-6 text-cyan-400 tracking-widest uppercase";
                    } else if (score < opponent.score) {
                        goSubtitle.innerText = "YOU LOST";
                        goSubtitle.className = "text-xl mb-6 text-red-500 tracking-widest uppercase";
                    } else {
                        goSubtitle.innerText = "DRAW";
                        goSubtitle.className = "text-xl mb-6 text-yellow-400 tracking-widest uppercase";
                    }
                    
                    document.getElementById('btn-restart').innerText = isHost ? "Rematch" : "Waiting for Host...";
                    document.getElementById('btn-restart').disabled = !isHost;
                    
                } else {
                    document.getElementById('go-multi-stats').classList.add('hidden');
                    document.getElementById('go-solo-stats').classList.remove('hidden');
                    finalHighscore.innerText = highScore;
                    highscoreDisplay.innerText = highScore;
                    goSubtitle.classList.add('hidden');
                    document.getElementById('btn-restart').innerText = "Reboot";
                    document.getElementById('btn-restart').disabled = false;
                }
            }, 1000);
        }

        function drawBackground() {
            let bgGradient = ctx.createLinearGradient(0, 0, 0, ch);
            bgGradient.addColorStop(0, '#020108'); bgGradient.addColorStop(1, '#0a0515');
            ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, cw, ch);

            stars.forEach(star => { star.update(); star.draw(); });
            
            ctx.save(); ctx.strokeStyle = 'rgba(255, 0, 255, 0.1)'; ctx.lineWidth = 1;
            ctx.shadowBlur = 5; ctx.shadowColor = '#f0f';
            
            let gridSpeed = (cw * 0.006) * gameSpeed * difficultyMultiplier;
            let offset = (frameCount * gridSpeed) % 40;
            
            ctx.beginPath();
            for(let x = -offset; x < cw; x += 40) { ctx.moveTo(x, ch * 0.85); ctx.lineTo(x - 100, ch); }
            for(let y = ch * 0.85; y < ch; y += 20) { ctx.moveTo(0, y); ctx.lineTo(cw, y); }
            ctx.stroke(); ctx.restore();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, cw, ch);
            drawBackground();

            if (gameState === 'PLAYING') {
                frameCount++;
                
                // Difficulty tied STRICTLY to time so host and guest never drift apart
                difficultyMultiplier = 1 + (frameCount * 0.0003);

                // Deterministic obstacle generation
                if (frameCount >= nextSpawnFrame) {
                    obstacles.push(new Obstacle());
                    let spawnRate = Math.max(50, 120 - Math.floor(frameCount * 0.015));
                    nextSpawnFrame = frameCount + spawnRate;
                }

                player.update();
                if(isMultiplayer) opponent.update();

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.update();
                    obs.draw();

                    if (!player.isDead && obs.checkCollision(player)) handleDeath();
                    // We don't calculate opponent death locally, just trust network
                    
                    // Client side scoring
                    if (!player.isDead && !obs.passed && player.x > obs.x + obs.width) {
                        score++;
                        scoreDisplay.innerText = score;
                        obs.passed = true;
                        obs.color = '#0ff';
                        
                        for(let j=0; j<5; j++) {
                            particles.push(new Particle(
                                player.x, player.y, (Math.random() - 0.5) * 5, (Math.random() - 0.5) * 5, '#0ff'
                            ));
                        }
                    }
                    if (obs.x + obs.width < 0) obstacles.splice(i, 1);
                }
            }

            if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                player.draw();
                if(isMultiplayer) opponent.draw();
                if(gameState === 'GAMEOVER') obstacles.forEach(obs => obs.draw());
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update(); p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (gameState === 'MENU' || gameState === 'LOBBY') {
                player.y = ch * 0.5 + Math.sin(Date.now() * 0.003) * 20;
                player.rotation = Math.sin(Date.now() * 0.002) * 0.1;
                player.draw();
            }

            requestAnimationFrame(gameLoop);
        }

        function resize() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            cw = canvas.width; ch = canvas.height;
            if(stars.length === 0) { for(let i=0; i<100; i++) stars.push(new Star()); }
            if(gameState === 'PLAYING') {
                player.size = Math.max(15, Math.min(25, ch * 0.025));
                player.gravity = ch * 0.0004;
                player.jumpStrength = ch * -0.008;
            }
        }

        window.addEventListener('resize', resize);
        resize();

        function handleInput(e) {
            if(e.type === 'touchstart' || (e.type === 'keydown' && e.code === 'Space')) {
                if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') e.preventDefault(); 
            }
            if (gameState === 'PLAYING') player.jump();
        }

        document.addEventListener('mousedown', handleInput);
        document.addEventListener('touchstart', handleInput, {passive: false});
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') handleInput(e);
        });

        // UI Buttons
        document.getElementById('btn-solo').addEventListener('click', () => {
            isMultiplayer = false;
            startMatch();
        });
        
        document.getElementById('btn-host').addEventListener('click', () => {
            if(!firebaseConfig) {
                alert("Multiplayer requires Firebase configuration.");
                return;
            }
            gameState = 'LOBBY';
            createRoom();
        });

        document.getElementById('btn-copy').addEventListener('click', () => {
            const copyText = document.getElementById('invite-link');
            copyText.select();
            document.execCommand('copy');
            
            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2000);
        });

        document.getElementById('btn-start-multi').addEventListener('click', hostStartGame);
        document.getElementById('btn-leave').addEventListener('click', leaveRoom);
        document.getElementById('btn-menu').addEventListener('click', leaveRoom);
        
        document.getElementById('btn-restart').addEventListener('click', () => {
            if(isMultiplayer && isHost) hostStartGame();
            else if (!isMultiplayer) startMatch();
        });

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
